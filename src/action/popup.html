<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../shared/page.css" />
    <link rel="stylesheet" href="popup.css" />
    <script src="../shared/messages.js"></script>
    <script src="../shared/settings.js"></script>
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header>
      <strong>Language Companion</strong>
      <span class="links"><span id="stats-link"><a href="#" id="open-stats">Stats</a> · </span><a href="#" id="open-options">Settings</a></span>
    </header>

    <p id="anki-status" hidden><span class="dot"></span><span class="text">Checking Anki…</span></p>
    <p id="summary" class="muted" hidden></p>

    <button type="button" id="open-reader" class="primary">Open in reader</button>
    <p id="reader-error" class="error" hidden></p>

    <label class="toggle"><input type="checkbox" id="enabled" /> Enabled</label>
    <label class="toggle"><input type="checkbox" id="youtube-enabled" /> Clickable YouTube subtitles</label>
    <label class="toggle" id="image-text-row" hidden><input type="checkbox" id="image-text" /> <span>Read text in images on <span id="image-text-site"></span></span></label>

    <p class="muted hint">Select a word on any page to translate it into English, or press <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>L</kbd>. In the reader, just click a word.</p>
  </body>
</html>
